<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>BrokenRanks Settings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Fira+Sans+Condensed:wght@400;500&family=Fira+Mono:wght@500&display=swap">
<style>
/* Layout: dark game-menu panel, sections flow into 1-3 columns; each row is label + key slot. Single dark look on purpose, matching the in-game settings screen. */
:root {
  --bg: #0f0f10;
  --panel: #19191b;
  --line: #2c2c30;
  --fg: #e6e3dc;
  --muted: #8d8a83;
  --slot: #3a3a3e;
  --slot-hover: #4a4a50;
  --listen: #c9a24a;
  --clash: #b5473a;
  --display: "Cinzel", Georgia, serif;
  --body: "Fira Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "Fira Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
h1 { font: 600 1.7rem/1.1 var(--display); letter-spacing: .04em; margin: 0; text-wrap: balance; }
.hint { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
button.act { font: 500 .85rem var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--fg);
  background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 7px 12px; cursor: pointer; }
button.act:hover { border-color: var(--muted); }
button.act:focus-visible, .slot:focus-visible { outline: 2px solid var(--listen); outline-offset: 2px; }
.grid { columns: 3 330px; column-gap: 28px; }
section { break-inside: avoid; background: var(--panel); border: 1px solid var(--line); padding: 14px 16px 12px; margin-bottom: 20px; }
h2 { font: 600 1.05rem var(--display); letter-spacing: .05em; margin: 0 0 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 118px; align-items: center; gap: 12px; padding: 3px 0; }
.row label { min-width: 0; }
.slot { font: 500 .85rem var(--mono); letter-spacing: .03em; color: var(--fg); background: var(--slot); border: 1px solid transparent;
  border-radius: 2px; height: 26px; width: 100%; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot:hover { background: var(--slot-hover); }
.slot.unset { color: var(--muted); }
.slot.changed { border-color: var(--muted); }
.slot.clash { border-color: var(--clash); box-shadow: inset 0 0 0 1px var(--clash); }
.slot.listening { background: var(--bg); border-color: var(--listen); color: var(--listen); animation: pulse 1s ease-in-out infinite; }
.fixed { font: 500 .85rem var(--mono); color: var(--muted); text-align: center; }
@keyframes pulse { 50% { border-color: transparent; } }
@media (prefers-reduced-motion: reduce) { .slot.listening { animation: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: .85rem; margin: -6px 0 18px; }
.legend i { display: inline-block; width: 22px; height: 12px; vertical-align: -1px; margin-right: 6px; background: var(--slot); border: 1px solid; }
#status { min-height: 1.4em; color: var(--muted); font-size: .9rem; margin-top: 8px; }
#status.warn { color: var(--clash); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>BrokenRanks Settings</h1>
      <p class="hint">Click a key slot, then press the key you want. Modifiers alone (Shift, Ctrl, Alt) bind when released. Right-click a slot to clear it to "-". Changes are kept in this browser.</p>
    </div>
    <div class="tools">
      <button class="act" id="copy" type="button">Copy as text</button>
      <button class="act" id="reset" type="button">Reset to defaults</button>
    </div>
  </header>
  <div class="legend">
    <span><i style="border-color:var(--muted)"></i>Changed from default</span>
    <span><i style="border-color:var(--clash)"></i>Same key used twice in one section</span>
  </div>
  <div class="grid" id="grid"></div>
  <p id="status" role="status"></p>
</div>

<script>
const DEFAULTS = [
  ["Windows", [
    ["Backpack","E"],["Skills","S"],["Tactics","-"],["Attributes","-"],["Achievements","-"],["Quests","Q"],
    ["Path of Exploration","-"],["Task","Z"],["Daily challenges","-"],["Weekly challenges","-"],["Guild","-"],
    ["Marketplace","B"],["Messages","-"],["Friends","F"],["Ranking","-"],["Settings","O"],["World map","M"],
    ["Map of the Trial","-"],["Close window","ESCAPE",true]]],
  ["Combat", [
    ["End round","SPACE"],["Tactic 1","1"],["Tactic 2","2"],["Tactic 3","3"],["Tactic 4","4"],
    ["Change opponent","TAB"],["Change ally","-"],["Combatants status","SHIFT"],["Effects in combat","CTRL"]]],
  ["Chat", [
    ["General","-"],["Beginners","-"],["Trade","-"],["Expedition","-"],["Party","-"],["Private","-"],
    ["Local","-"],["Faction","-"],["Guild","-"],["Start typing","ENTER",true],["Finish typing","ESCAPE",true],["Linking","CTRL+LMB",true]]],
  ["Map", [["Party lock","L"],["Party","-"]]],
  ["Other", [
    ["Leave the party","T"],["NPC names","C"],["Potions","P"],["Switch modes","A"],["Characters in range","N"],["Turn pets on/off","-"]]],
  ["Gestures", [
    ["Bow","1"],["Facepalm","2"],["Clap","3"],["Dance","4"],["Wail","5"],["Threaten","6"],["Think","7"],
    ["Ask","8"],["Point","9"],["Wave","0"]]]
];
const STORE = "brokenranks-settings-v1";
let binds = {};
try { binds = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(binds)); } catch (e) {} };
const id = (s, a) => s + "/" + a;
const def = {};
DEFAULTS.forEach(([s, rows]) => rows.forEach(([a, k]) => def[id(s, a)] = k));
const current = k => binds[k] ?? def[k];

const NAMES = { " ": "SPACE", Control: "CTRL", Escape: "ESCAPE", ArrowUp: "UP", ArrowDown: "DOWN", ArrowLeft: "LEFT",
  ArrowRight: "RIGHT", Backspace: "BACKSPACE", Delete: "DELETE", Insert: "INSERT", PageUp: "PAGE UP", PageDown: "PAGE DOWN",
  CapsLock: "CAPS LOCK", Meta: "WIN", ContextMenu: "MENU" };
function keyName(e) {
  if (e.code.startsWith("Numpad")) return "NUM " + e.code.slice(6).replace("Add", "+").replace("Subtract", "-")
    .replace("Multiply", "*").replace("Divide", "/").replace("Decimal", ".").toUpperCase();
  if (/^Digit\d$/.test(e.code)) return e.code.slice(5);
  if (/^Key[A-Z]$/.test(e.code)) return e.code.slice(3);
  const n = NAMES[e.key] ?? (e.key.length === 1 ? e.key.toUpperCase() : e.key.toUpperCase());
  return n;
}
const MODS = { Shift: "SHIFT", Control: "CTRL", Alt: "ALT" };

const grid = document.getElementById("grid");
DEFAULTS.forEach(([s, rows]) => {
  const sec = document.createElement("section");
  sec.innerHTML = `<h2>${s}</h2>`;
  rows.forEach(([a, , fixed]) => {
    const row = document.createElement("div");
    row.className = "row";
    const slotId = "k-" + id(s, a).replace(/[^a-z0-9]+/gi, "-").toLowerCase();
    if (fixed) {
      row.innerHTML = `<label>${a}</label><span class="fixed">${def[id(s, a)]}</span>`;
    } else {
      row.innerHTML = `<label for="${slotId}">${a}</label><button class="slot" type="button" id="${slotId}"></button>`;
      const b = row.querySelector("button");
      b.dataset.key = id(s, a);
      b.dataset.section = s;
    }
    sec.appendChild(row);
  });
  grid.appendChild(sec);
});
const slots = [...document.querySelectorAll(".slot")];
const status = document.getElementById("status");
const say = (t, warn) => { status.textContent = t; status.classList.toggle("warn", !!warn); };

function render() {
  const seen = {};
  slots.forEach(b => {
    const v = current(b.dataset.key);
    if (v !== "-") (seen[b.dataset.section + "|" + v] ||= []).push(b);
  });
  slots.forEach(b => {
    if (b === listening) return;
    const v = current(b.dataset.key);
    b.textContent = v;
    b.classList.toggle("unset", v === "-");
    b.classList.toggle("changed", v !== def[b.dataset.key]);
    b.classList.toggle("clash", v !== "-" && seen[b.dataset.section + "|" + v].length > 1);
  });
}

let listening = null, pendingMod = null;
function stop() {
  if (!listening) return;
  listening.classList.remove("listening");
  listening = null; pendingMod = null;
  render();
}
function assign(v) {
  const b = listening, k = b.dataset.key;
  if (v === def[k]) delete binds[k]; else binds[k] = v;
  save(); stop();
  const name = k.split("/")[1];
  const clash = slots.find(o => o !== b && o.dataset.section === b.dataset.section && current(o.dataset.key) === v && v !== "-");
  clash ? say(`${name} set to ${v}. ${clash.dataset.key.split("/")[1]} also uses ${v}.`, true) : say(`${name} set to ${v}.`);
}
slots.forEach(b => {
  b.addEventListener("click", () => {
    if (listening === b) return stop();
    stop();
    listening = b;
    b.classList.add("listening");
    b.textContent = "press a key…";
    say("Press a key for " + b.dataset.key.split("/")[1] + ". Click the slot again to cancel.");
  });
  b.addEventListener("contextmenu", e => {
    e.preventDefault(); stop();
    listening = b; assign("-");
  });
});
document.addEventListener("keydown", e => {
  if (!listening) return;
  e.preventDefault(); e.stopPropagation();
  if (MODS[e.key]) { pendingMod = MODS[e.key]; listening.textContent = pendingMod + "+…"; return; }
  const parts = [];
  if (e.ctrlKey) parts.push("CTRL");
  if (e.altKey) parts.push("ALT");
  if (e.shiftKey) parts.push("SHIFT");
  parts.push(keyName(e));
  pendingMod = null;
  assign(parts.join("+"));
}, true);
document.addEventListener("keyup", e => {
  if (listening && pendingMod && MODS[e.key] === pendingMod) { e.preventDefault(); assign(pendingMod); }
}, true);
document.addEventListener("mousedown", e => { if (listening && !e.target.closest(".slot")) stop(); });
window.addEventListener("blur", stop);

document.getElementById("reset").addEventListener("click", () => {
  binds = {}; save(); stop(); render(); say("All keys reset to defaults.");
});
document.getElementById("copy").addEventListener("click", () => {
  const text = DEFAULTS.map(([s, rows]) => s + "\n" + rows.map(([a]) => `  ${a}: ${current(id(s, a))}`).join("\n")).join("\n\n");
  navigator.clipboard.writeText(text).then(() => say("Copied all bindings as text."),
    () => say("Copy was blocked by this browser.", true));
});
render();
</script>
</body>
</html>
